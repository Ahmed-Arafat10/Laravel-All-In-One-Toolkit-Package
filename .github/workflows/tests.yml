name: Package tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '10', php: '8.1' }
          - { laravel: '11', php: '8.2' }
          - { laravel: '12', php: '8.2' }
          - { laravel: '13', php: '8.3' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: composer update --with "laravel/framework:^${{ matrix.laravel }}.0" --prefer-dist --no-interaction
      - run: composer test
